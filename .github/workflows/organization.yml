# The organization's checks of a pull request, reusable workflows of xippios/.github called
# at @main (conventions §13), their contract in that repository's README.
#
# `conventions` reviews the pull request against the documents README.md lists under
# `## Documents`, read from main, by the mode the variable CONVENTIONS_REVIEW sets: the
# default, `release`, reviews a release pull request, which the callee tells by its own
# condition, and passes any other as skipped. It gets ANTHROPIC_API_KEY by name, never
# `secrets: inherit`, and the permissions the callee asks for: `pull-requests: write` for its
# one comment and `checks: read` for the head's checks. `adr-index` runs
# scripts/adr_index.py --check on the checkout and takes no input and no secret.
#
# The workflow runs on the opening, a push, a reopening and an edit: `edited` because the
# review reads the title and the description, and a change of the base arrives as `edited`.
# It does not run on `labeled`, and neither job has a condition of its own: GitHub reports a
# head's checks from its newest run, and a label set at the opening started a run that
# skipped both jobs. A label set after the opening counts from the next push or edit.
name: Organization

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  conventions:
    uses: xippios/.github/.github/workflows/conventions.yml@main
    permissions:
      contents: read
      pull-requests: write
      checks: read
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  adr-index:
    uses: xippios/.github/.github/workflows/adr-index.yml@main
