# Conventions §11: ruff, mypy --strict and detect-secrets. Nothing else.
# .copier-answers.yml is excluded from secret detection: in a generated repository it can
# name the key's environment variable (never a key value), which trips the keyword check.
# The scan skips two lines the fixture recorder writes, high in entropy by nature: a body
# stored base64, 100 characters or more as base64 writes them, and the whole body's
# sha256. A text body, a header and every other line are still scanned.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: mypy
        name: mypy --strict
        entry: uv run --frozen mypy
        language: system
        types: [python]
        pass_filenames: false
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args:
          - --baseline
          - .secrets.baseline
          - --exclude-lines
          - '^\s*"body": "(?:[A-Za-z0-9+/]{4}){25,}(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?",?$'
          - --exclude-lines
          - '^\s*"sha256": "[0-9a-f]{64}",?$'
        exclude: ^(uv\.lock|\.copier-answers\.yml)$
