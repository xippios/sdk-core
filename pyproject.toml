[project]
name = "xippios-core"
version = "0.3.0"
description = "Shared core for the xippios Python SDK family: HTTP client, models, errors, MCP/HTTP adapters"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "XIPPIOS GmbH" }]
keywords = ["sdk", "httpx", "pydantic", "mcp", "fastapi"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.28",
  "pydantic>=2.11",
]

[project.optional-dependencies]
mcp = ["mcp>=2.0"]
http = ["fastapi>=0.115"]
testing = ["pytest>=8", "respx>=0.22", "anyio>=4", "httpcore>=1.0", "packaging>=22"]

[project.urls]
Homepage = "https://github.com/xippios/sdk-core"
Changelog = "https://github.com/xippios/sdk-core/blob/main/CHANGELOG.md"
Issues = "https://github.com/xippios/sdk-core/issues"

[dependency-groups]
dev = [
  "ruff>=0.14",
  "mypy>=1.18",
  "pre-commit>=4",
  "pytest>=8",
  "respx>=0.22",
  "anyio>=4",
  "detect-secrets>=1.5",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xippios"]

[tool.hatch.build.targets.sdist]
# Anchored at the root: an unanchored "README.md" or "LICENSE" matches one at any depth.
include = ["/src", "/tests", "/docs", "/README.md", "/CHANGELOG.md", "/LICENSE"]
exclude = ["/docs/handover.md"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "D", "ANN", "PTH", "PT", "T20", "C4"]
ignore = [
  "ANN401", # Any is allowed where upstream payloads are untyped by nature
  "D105",   # magic methods need no docstring
  "D107",   # __init__ is documented on the class
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
files = ["src", "tests"]
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true
warn_unreachable = true

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --import-mode=importlib"
testpaths = ["tests"]
